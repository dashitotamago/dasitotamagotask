<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曜日別 発注・業務チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221f1a; --paper:#efe9dc; --card:#faf7ef; --line:#c9bfa4; --accent:#2f5d55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .wrap{max-width:420px;width:100%;}
  h1{font-family:'Shippori Mincho',serif;font-size:22px;margin:0 0 6px;text-align:center;}
  p.lead{font-size:13px;color:#6b6355;text-align:center;margin:0 0 24px;}
  a.card{
    display:block;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:14px;
    text-decoration:none;
    color:var(--ink);
  }
  a.card .label{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;margin-bottom:4px;}
  a.card .desc{font-size:12.5px;color:#6b6355;}
  a.card.admin{border-color:var(--accent);}
  a.card.admin .label{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>曜日別 発注・業務チェック</h1>
  <p class="lead">用途に合わせて選んでください</p>
  <a class="card" href="staff.html">
    <div class="label">📋 スタッフ用サイト</div>
    <div class="desc">曜日ごとの発注・掃除・業務チェックはこちら</div>
  </a>
  <a class="card admin" href="admin.html">
    <div class="label">⚙️ 管理サイト</div>
    <div class="desc">発注の定数やチェック項目の編集はこちら</div>
  </a>
</div>
</body>
</html>
